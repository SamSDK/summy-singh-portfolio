<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Summy Singh — Premium UGC Creator</title>
    <meta
      name="description"
      content="Summy Singh — premium UGC creator. Short-form video, photo sets and testimonials for brands that need to move fast."
    />
    <meta name="theme-color" content="#f7f3ec" />
    <!-- Root-relative on purpose: Vite rewrites this with `base` at build time, so it
         resolves correctly under the GitHub Pages subpath. Do NOT add %BASE_URL% here —
         that expands to the base too, and the path ends up doubled. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph: this link gets pasted into DMs and Slack, where a bare URL
         with no preview reads as low-effort. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Summy Singh — Premium UGC Creator" />
    <meta
      property="og:description"
      content="Short-form content that actually converts — scripted, shot and delivered for brands that need to move fast."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Typeface lives here and in --font-sans in index.css. Those two places are the
         only edits needed to swap the whole site's face. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500&family=IBM+Plex+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
